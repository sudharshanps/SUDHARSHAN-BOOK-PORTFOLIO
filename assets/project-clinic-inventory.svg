<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="60%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bg4)"/>

  <!-- Left: Healthcare Clinic Cross & Stock Card -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="180" height="190" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1.5"/>
    
    <!-- Medical Cross with glow -->
    <g transform="translate(90, 45)">
      <circle cx="0" cy="0" r="26" fill="rgba(20, 184, 166, 0.15)" stroke="#14b8a6" stroke-width="1.5"/>
      <rect x="-5" y="-14" width="10" height="28" rx="2" fill="#2dd4bf"/>
      <rect x="-14" y="-5" width="28" height="10" rx="2" fill="#2dd4bf"/>
    </g>

    <text x="90" y="95" fill="#5eead4" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">CLINIC PHARMACY</text>
    <text x="90" y="112" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">INVENTORY LOGISTICS</text>

    <!-- Mini Stock levels -->
    <rect x="25" y="130" width="130" height="8" rx="4" fill="#1e293b"/>
    <rect x="25" y="130" width="105" height="8" rx="4" fill="#14b8a6"/>
    
    <rect x="25" y="150" width="130" height="8" rx="4" fill="#1e293b"/>
    <rect x="25" y="150" width="80" height="8" rx="4" fill="#eef6ff"/>

    <text x="90" y="175" fill="#99f6e4" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">STOCK TRACKING: AUTO</text>
  </g>

  <!-- Center: JDBC Bridge -->
  <g transform="translate(250, 150)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4"/>
    <polygon points="70,-5 82,0 70,5" fill="#38bdf8"/>
    <rect x="15" y="-22" width="50" height="18" rx="4" fill="#eef6ff"/>
    <text x="40" y="-10" fill="#142b4d" font-family="'Fira Code', monospace" font-weight="600" font-size="9" text-anchor="middle">JDBC</text>
    <text x="40" y="20" fill="#7dd3fc" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">JAVA API</text>
  </g>

  <!-- Right: Relational Database / MySQL Schema -->
  <g transform="translate(340, 60)">
    <rect x="0" y="0" width="200" height="200" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>

    <!-- Cylinder / DB icon -->
    <g transform="translate(35, 30)">
      <ellipse cx="15" cy="0" rx="15" ry="6" fill="#eef6ff" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 0 0 V 16 C 0 20 30 20 30 16 V 0" fill="#eef6ff" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 0 8 C 0 12 30 12 30 8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <text x="80" y="32" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="12">MYSQL SCHEMA</text>
    <text x="80" y="47" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">NORMALIZED (3NF)</text>

    <!-- Schema Table Visual -->
    <rect x="20" y="65" width="160" height="115" rx="6" fill="#eef6ff" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="20" y="65" width="160" height="22" rx="6" fill="#eef6ff"/>
    <text x="30" y="80" fill="#142b4d" font-family="'Fira Code', monospace" font-weight="600" font-size="10">TABLE: clinic_stock</text>

    <!-- Table Columns -->
    <text x="28" y="102" fill="#2dd4bf" font-family="'Fira Code', monospace" font-size="9">PK item_id INT AUTO</text>
    <text x="28" y="118" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9">   medicine_name VARCHAR</text>
    <text x="28" y="134" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9">   batch_no VARCHAR</text>
    <text x="28" y="150" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9">   stock_quantity INT</text>
    <text x="28" y="166" fill="#facc15" font-family="'Fira Code', monospace" font-size="9">FK supplier_id INT</text>
  </g>

  <!-- Bottom Badge -->
  <rect x="190" y="280" width="220" height="30" rx="15" fill="rgba(20, 184, 166, 0.15)" stroke="#14b8a6" stroke-width="1"/>
  <text x="300" y="299" fill="#2dd4bf" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">JAVA • MYSQL • JDBC ARCHITECTURE</text>
</svg>
