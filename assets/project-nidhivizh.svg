<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nidhiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff" />
      <stop offset="50%" stop-color="#eef6ff" />
      <stop offset="100%" stop-color="#eef6ff" />
    </linearGradient>
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#eef6ff" />
    </linearGradient>
    <filter id="nidhiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#nidhiBg)" rx="12" />

  <!-- Grid lines -->
  <g stroke="rgba(36, 99, 235, 0.12)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="420" y1="0" x2="420" y2="360" />
    <line x1="540" y1="0" x2="540" y2="360" />
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
  </g>

  <!-- Evidence Graph Nodes & Connecting Edges -->
  <!-- Center Node: Investigation Core -->
  <circle cx="300" cy="180" r="38" fill="#ffffff" stroke="#fbbf24" stroke-width="2.5" filter="url(#nidhiGlow)" />
  <circle cx="300" cy="180" r="28" fill="none" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="300" y="185" fill="#142b4d" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">EVIDENCE</text>

  <!-- Node 1: Transaction Entity -->
  <circle cx="150" cy="110" r="24" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <text x="150" y="114" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">BANK TX</text>

  <!-- Node 2: Entity Risk Cluster -->
  <circle cx="450" cy="110" r="24" fill="#ffffff" stroke="#f43f5e" stroke-width="2" />
  <text x="450" y="114" fill="#f43f5e" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">RISK CLUSTER</text>

  <!-- Node 3: Compliance Bridge -->
  <circle cx="170" cy="260" r="24" fill="#ffffff" stroke="#dceeff" stroke-width="2" />
  <text x="170" y="264" fill="#dceeff" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">CSR AUDIT</text>

  <!-- Node 4: Regulatory Packet -->
  <circle cx="430" cy="260" r="24" fill="#ffffff" stroke="#c084fc" stroke-width="2" />
  <text x="430" y="264" fill="#c084fc" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">REPORT</text>

  <!-- Connecting Edges with flow dots -->
  <line x1="172" y1="122" x2="265" y2="162" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="428" y1="122" x2="335" y2="162" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="190" y1="245" x2="270" y2="198" stroke="#dceeff" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="410" y1="245" x2="330" y2="198" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 3" />

  <!-- Badge Top -->
  <rect x="180" y="25" width="240" height="28" rx="14" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1" />
  <text x="300" y="43" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">FINANCIAL RISK &amp; COMPLIANCE BRIDGE</text>

  <!-- Metrics Bottom -->
  <g transform="translate(130, 310)">
    <rect width="100" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="50" y="17" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Evidence Graph</text>
  </g>
  <g transform="translate(250, 310)">
    <rect width="100" height="26" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="50" y="17" fill="#dceeff" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Trail Audit</text>
  </g>
  <g transform="translate(370, 310)">
    <rect width="100" height="26" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
    <text x="50" y="17" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Fraud Triage</text>
  </g>
</svg>
