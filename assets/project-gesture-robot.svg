<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="60%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bg2)"/>

  <!-- Circuit lines -->
  <g stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.5" fill="none">
    <path d="M 40 50 H 120 L 150 80 H 220"/>
    <path d="M 40 290 H 140 L 170 260 H 240"/>
    <path d="M 560 50 H 480 L 450 80 H 380"/>
    <path d="M 560 290 H 460 L 430 260 H 360"/>
    <circle cx="120" cy="50" r="3" fill="#38bdf8"/>
    <circle cx="220" cy="80" r="3" fill="#38bdf8"/>
    <circle cx="480" cy="50" r="3" fill="#38bdf8"/>
    <circle cx="360" cy="260" r="3" fill="#38bdf8"/>
  </g>

  <!-- Left: MediaPipe Hand Landmark Mesh -->
  <g transform="translate(60, 80)">
    <rect x="-10" y="-10" width="170" height="180" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <text x="75" y="15" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">MEDIAPIPE VISION</text>
    
    <!-- Hand skeleton landmarks -->
    <!-- Wrist -->
    <circle cx="75" cy="140" r="4" fill="#38bdf8"/>
    <!-- Palm base -->
    <line x1="75" y1="140" x2="50" y2="110" stroke="#eef6ff" stroke-width="2"/>
    <line x1="75" y1="140" x2="65" y2="100" stroke="#eef6ff" stroke-width="2"/>
    <line x1="75" y1="140" x2="85" y2="100" stroke="#eef6ff" stroke-width="2"/>
    <line x1="75" y1="140" x2="105" y2="115" stroke="#eef6ff" stroke-width="2"/>
    
    <!-- Thumb -->
    <circle cx="50" cy="110" r="3.5" fill="#38bdf8"/>
    <line x1="50" y1="110" x2="35" y2="90" stroke="#eef6ff" stroke-width="2"/>
    <circle cx="35" cy="90" r="4" fill="#22d3ee"/>

    <!-- Index Finger -->
    <circle cx="65" cy="100" r="3.5" fill="#38bdf8"/>
    <line x1="65" y1="100" x2="65" y2="60" stroke="#eef6ff" stroke-width="2"/>
    <circle cx="65" cy="60" r="3.5" fill="#38bdf8"/>
    <line x1="65" y1="60" x2="65" y2="35" stroke="#eef6ff" stroke-width="2"/>
    <circle cx="65" cy="35" r="4" fill="#22d3ee"/>

    <!-- Middle Finger -->
    <circle cx="85" cy="100" r="3.5" fill="#38bdf8"/>
    <line x1="85" y1="100" x2="85" y2="55" stroke="#eef6ff" stroke-width="2"/>
    <circle cx="85" cy="55" r="3.5" fill="#38bdf8"/>
    <line x1="85" y1="55" x2="85" y2="30" stroke="#eef6ff" stroke-width="2"/>
    <circle cx="85" cy="30" r="4" fill="#22d3ee"/>

    <!-- Ring & Pinky -->
    <circle cx="105" cy="115" r="3.5" fill="#38bdf8"/>
    <line x1="105" y1="115" x2="108" y2="85" stroke="#eef6ff" stroke-width="2"/>
    <circle cx="108" cy="85" r="4" fill="#22d3ee"/>

    <text x="75" y="160" fill="#a5f3fc" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">GESTURE: FORWARD</text>
  </g>

  <!-- Center: WiFi transmission waves -->
  <g transform="translate(250, 160)">
    <path d="M 0 -25 A 35 35 0 0 1 0 25" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 15 -40 A 55 55 0 0 1 15 40" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 30 -55 A 75 75 0 0 1 30 55" fill="none" stroke="#eef6ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="15" y="-65" fill="#67e8f9" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">FLASK REST API</text>
    <text x="15" y="75" fill="#67e8f9" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">WiFi 2.4GHz</text>
  </g>

  <!-- Right: Robot Car & ESP32 Controller -->
  <g transform="translate(340, 90)">
    <rect x="0" y="0" width="200" height="160" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="24" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">ESP32 ROBOT CAR</text>

    <!-- Robot Car Body (Isometric / Top-down view) -->
    <rect x="40" y="45" width="120" height="70" rx="10" fill="#eef6ff" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- 4 Wheels -->
    <rect x="25" y="45" width="12" height="28" rx="4" fill="#eef6ff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="25" y="87" width="12" height="28" rx="4" fill="#eef6ff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="163" y="45" width="12" height="28" rx="4" fill="#eef6ff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="163" y="87" width="12" height="28" rx="4" fill="#eef6ff" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- ESP32 Chip on Car -->
    <rect x="75" y="60" width="50" height="40" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="100" y="84" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">ESP32</text>
    
    <!-- Status LED -->
    <circle cx="118" cy="68" r="3" fill="#22c55e"/>

    <!-- Speed / Direction Indicator -->
    <text x="100" y="140" fill="#22c55e" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">MOTOR: RUNNING (LOW LATENCY)</text>
  </g>
</svg>
