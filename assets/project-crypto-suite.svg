<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCrypto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="50%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="cipherCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgCrypto)"/>

  <!-- Hex and binary matrix background -->
  <g fill="rgba(0, 242, 254, 0.12)" font-family="'Fira Code', monospace" font-size="10">
    <text x="30" y="35">0x5F3759DF 0x7E048A1B 0x3C4D5E6F 0x90A1B2C3</text>
    <text x="30" y="315">SHA256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>
  </g>

  <!-- Left: AES-256 Block Cipher Pipeline -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="220" height="195" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#eef6ff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">AES-256 ENCRYPTION CORE</text>

    <!-- Plaintext block -->
    <rect x="20" y="40" width="180" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="58" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Plaintext User Payload</text>

    <!-- Arrow -->
    <line x1="110" y1="68" x2="110" y2="82" stroke="#eef6ff" stroke-width="2"/>

    <!-- Key Schedule / 14 Rounds -->
    <rect x="20" y="82" width="180" height="36" rx="5" fill="#eef6ff" stroke="#dceeff" stroke-width="1.5"/>
    <text x="110" y="97" fill="#34d399" font-family="'Fira Code', monospace" font-size="10" font-weight="600" text-anchor="middle">AES Key Schedule (256-bit)</text>
    <text x="110" y="111" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">14 Transformation Rounds</text>

    <!-- Arrow -->
    <line x1="110" y1="118" x2="110" y2="132" stroke="#eef6ff" stroke-width="2"/>

    <!-- Ciphertext output -->
    <rect x="20" y="132" width="180" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="150" fill="#7dd3fc" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Ciphertext (IV + Encrypted)</text>

    <!-- Benchmark tag -->
    <text x="110" y="180" fill="#a5f3fc" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">MODE: CBC / PKCS#7 PADDING</text>
  </g>

  <!-- Center comparison / hash flow -->
  <g transform="translate(285, 140)">
    <!-- Lock symbol -->
    <circle cx="15" cy="0" r="18" fill="rgba(0, 242, 254, 0.15)" stroke="#eef6ff" stroke-width="1.5"/>
    <rect x="8" y="-4" width="14" height="12" rx="2" fill="#eef6ff"/>
    <path d="M 11 -4 V -9 A 4 4 0 0 1 19 -9 V -4" fill="none" stroke="#eef6ff" stroke-width="2"/>
  </g>

  <!-- Right: SHA-256 Integrity Verification & DES Benchmark -->
  <g transform="translate(330, 60)">
    <rect x="0" y="0" width="220" height="195" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">SHA-256 HASH &amp; DES BENCHMARK</text>

    <!-- Hashing box -->
    <rect x="15" y="40" width="190" height="42" rx="5" fill="#1e293b" stroke="#dceeff" stroke-width="1"/>
    <text x="25" y="57" fill="#34d399" font-family="'Fira Code', monospace" font-size="10">SHA-256 Integrity Hash:</text>
    <text x="25" y="73" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8">HMAC Salted Digest / Tamper-Proof</text>

    <!-- DES Comparison box -->
    <rect x="15" y="92" width="190" height="42" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="109" fill="#fde047" font-family="'Fira Code', monospace" font-size="10">DES 56-bit Benchmark:</text>
    <text x="25" y="125" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8">Brute-Force Risk &amp; Feistel Rounds</text>

    <!-- Database Storage Secure Pill -->
    <rect x="15" y="144" width="190" height="38" rx="5" fill="#eef6ff" stroke="#eef6ff" stroke-width="1"/>
    <text x="110" y="160" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">SECURE DB STORAGE LAYER</text>
    <text x="110" y="174" fill="#67e8f9" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">Zero Plaintext Exposure</text>
  </g>

  <!-- Bottom Badge -->
  <rect x="150" y="275" width="300" height="34" rx="17" fill="rgba(16, 185, 129, 0.12)" stroke="#dceeff" stroke-width="1.5"/>
  <text x="300" y="297" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">USER DATA CRYPTOGRAPHIC SECURITY SUITE</text>
</svg>
