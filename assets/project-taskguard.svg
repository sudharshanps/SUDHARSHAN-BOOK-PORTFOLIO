<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="50%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6db33f"/>
      <stop offset="100%" stop-color="#348424"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgTg)"/>

  <!-- Enterprise Grid lines -->
  <g stroke="rgba(56, 189, 248, 0.12)" stroke-width="1">
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
  </g>

  <!-- Left: Enterprise Architecture Layer (Spring Boot + JWT) -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="220" height="210" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">SPRING BOOT ARCHITECTURE</text>
    
    <!-- Layers -->
    <rect x="15" y="40" width="190" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="58" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Controller: REST API / JWT</text>

    <rect x="15" y="76" width="190" height="28" rx="5" fill="#1e293b" stroke="#6db33f" stroke-width="1"/>
    <text x="110" y="94" fill="#86efac" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Service: RBAC &amp; Workflows</text>

    <rect x="15" y="112" width="190" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="130" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Repository: Spring Data JPA</text>

    <rect x="15" y="148" width="190" height="28" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="110" y="166" fill="#fde047" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Database: MySQL (InnoDB)</text>

    <!-- Token Badge -->
    <rect x="30" y="184" width="160" height="18" rx="9" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="110" y="196" fill="#7dd3fc" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">token: taskguard_jwt</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(285, 140)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="30,-5 42,0 30,5" fill="#38bdf8"/>
    <line x1="42" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Right: Executive Milestone & Task Kanban UI -->
  <g transform="translate(330, 50)">
    <rect x="0" y="0" width="220" height="210" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">EXECUTIVE KANBAN CONTROL</text>

    <!-- Task Column 1 -->
    <rect x="15" y="40" width="90" height="150" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <text x="60" y="55" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">INITIATIVES (8)</text>
    <rect x="22" y="65" width="76" height="34" rx="4" fill="#eef6ff" stroke="#eef6ff" stroke-width="1"/>
    <text x="60" y="80" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">INIT-001</text>
    <text x="60" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Core Security</text>

    <rect x="22" y="105" width="76" height="34" rx="4" fill="#eef6ff" stroke="#dceeff" stroke-width="1"/>
    <text x="60" y="120" fill="#34d399" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">INIT-002</text>
    <text x="60" y="132" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">API Audit</text>

    <!-- Task Column 2 -->
    <rect x="115" y="40" width="90" height="150" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <text x="160" y="55" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">COMPLETED (14)</text>
    <rect x="122" y="65" width="76" height="34" rx="4" fill="#eef6ff" stroke="#dceeff" stroke-width="1"/>
    <text x="160" y="80" fill="#34d399" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">AUTH-MOD</text>
    <text x="160" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">JWT Filter</text>

    <rect x="122" y="105" width="76" height="34" rx="4" fill="#eef6ff" stroke="#dceeff" stroke-width="1"/>
    <text x="160" y="120" fill="#34d399" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">RBAC-SYS</text>
    <text x="160" y="132" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Role Check</text>
  </g>

  <!-- Bottom Platform Tag -->
  <rect x="160" y="280" width="280" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="302" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">TASKGUARD • ENTERPRISE TASK SYSTEM</text>
</svg>
