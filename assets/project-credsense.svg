<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="50%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="gitBranch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="shieldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgCred)"/>

  <!-- Scanning grid line overlay -->
  <g stroke="rgba(36, 99, 235, 0.12)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
  </g>

  <!-- Left: Git Commit History Tree -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="220" height="200" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#eef6ff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">GIT COMMIT HISTORY SCANNER</text>

    <!-- Branch lines -->
    <line x1="35" y1="50" x2="35" y2="175" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="35" y1="95" x2="70" y2="135" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="70" y1="135" x2="70" y2="175" stroke="#f43f5e" stroke-width="2"/>

    <!-- Commits -->
    <circle cx="35" cy="55" r="6" fill="#38bdf8"/>
    <text x="50" y="59" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9">commit 9c4a8b: auth</text>

    <circle cx="35" cy="95" r="6" fill="#38bdf8"/>
    <text x="50" y="99" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9">commit 7e2f1d: api</text>

    <!-- Vulnerable commit flagged -->
    <circle cx="70" cy="140" r="7" fill="#ef4444"/>
    <circle cx="70" cy="140" r="13" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <text x="88" y="144" fill="#f87171" font-family="'Fira Code', monospace" font-size="9">FLAGGED: API_KEY</text>

    <rect x="25" y="172" width="170" height="18" rx="4" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="110" y="184" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">LEAK DETECTED: AWS_SECRET_KEY</text>
  </g>

  <!-- Right: AI SAST Risk Scoring Model -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="220" height="200" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#eef6ff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">AI RISK VERIFICATION &amp; SAST</text>

    <!-- Dial gauge / meter -->
    <g transform="translate(110, 80)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="8"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#ef4444" stroke-width="8" stroke-dasharray="210 264" transform="rotate(-90)"/>
      <text x="0" y="6" fill="#f87171" font-family="'Inter', sans-serif" font-weight="800" font-size="16" text-anchor="middle">HIGH</text>
      <text x="0" y="20" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">SCORE: 9.4/10</text>
    </g>

    <!-- Metrics -->
    <rect x="20" y="135" width="180" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="30" y="151" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9">Entropy: 4.82 (High)</text>

    <rect x="20" y="165" width="180" height="24" rx="4" fill="#1e293b" stroke="#dceeff" stroke-width="1"/>
    <text x="30" y="181" fill="#34d399" font-family="'Fira Code', monospace" font-size="9">Remediation: Revoke Token</text>
  </g>

  <!-- Bottom Badge -->
  <rect x="150" y="280" width="300" height="34" rx="17" fill="rgba(0, 242, 254, 0.15)" stroke="#eef6ff" stroke-width="1.5"/>
  <text x="300" y="302" fill="#eef6ff" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">CREDSENSE AI • GIT SECRET DETECTION</text>
</svg>
