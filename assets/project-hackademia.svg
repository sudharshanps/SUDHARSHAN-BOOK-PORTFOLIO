<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="60%" stop-color="#14223b"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bg3)"/>

  <!-- Scanning grid line overlay -->
  <line x1="0" y1="170" x2="600" y2="170" stroke="rgba(0, 171, 240, 0.2)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="340" stroke="rgba(0, 171, 240, 0.2)" stroke-width="1"/>

  <!-- Camera Viewfinder frame -->
  <g transform="translate(140, 45)">
    <!-- Corner brackets -->
    <path d="M 0 30 V 0 H 30" fill="none" stroke="#eef6ff" stroke-width="3"/>
    <path d="M 290 0 H 320 V 30" fill="none" stroke="#eef6ff" stroke-width="3"/>
    <path d="M 0 190 V 220 H 30" fill="none" stroke="#eef6ff" stroke-width="3"/>
    <path d="M 290 220 H 320 V 190" fill="none" stroke="#eef6ff" stroke-width="3"/>

    <!-- REC indicator -->
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <text x="36" y="26" fill="#f87171" font-family="'Inter', sans-serif" font-weight="700" font-size="11">AI PROCTORING ACTIVE</text>
    <text x="245" y="26" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">FPS: 30</text>

    <!-- Face Bounding Box & Landmarks -->
    <rect x="85" y="45" width="150" height="150" rx="12" fill="rgba(0, 171, 240, 0.08)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Face outline -->
    <ellipse cx="160" cy="115" rx="42" ry="52" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5"/>

    <!-- Eye gaze tracking points -->
    <circle cx="145" cy="105" r="4" fill="#eef6ff"/>
    <circle cx="175" cy="105" r="4" fill="#eef6ff"/>
    <line x1="135" y1="105" x2="155" y2="105" stroke="#38bdf8" stroke-width="1"/>
    <line x1="165" y1="105" x2="185" y2="105" stroke="#38bdf8" stroke-width="1"/>
    <!-- Gaze vector -->
    <line x1="145" y1="105" x2="148" y2="92" stroke="#22c55e" stroke-width="2"/>
    <line x1="175" y1="105" x2="178" y2="92" stroke="#22c55e" stroke-width="2"/>

    <!-- Nose / mouth landmarks -->
    <line x1="160" y1="115" x2="160" y2="128" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="160" cy="142" rx="14" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Head Pose Label -->
    <rect x="95" y="175" width="130" height="18" rx="4" fill="rgba(15, 23, 42, 0.85)"/>
    <text x="160" y="188" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">GAZE: FORWARD (NORMAL)</text>

    <!-- Alert / Detection Metric overlay -->
    <rect x="245" y="70" width="165" height="100" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(0, 171, 240, 0.35)" stroke-width="1"/>
    <text x="255" y="90" fill="#a5f3fc" font-family="'Inter', sans-serif" font-weight="600" font-size="10">BEHAVIOR ANALYSIS</text>
    <text x="255" y="110" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">Face Detect: 99.2%</text>
    <text x="255" y="128" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">Multiple Faces: 0</text>
    <text x="255" y="146" fill="#34d399" font-family="'Fira Code', monospace" font-size="9">Anomaly Score: LOW (0.04)</text>
  </g>

  <!-- Bottom Award Badge: Top 50 Finalist -->
  <g transform="translate(170, 285)">
    <rect x="0" y="0" width="260" height="36" rx="18" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Trophy icon -->
    <path d="M 22 12 H 30 V 17 C 30 20 28 22 26 22 C 24 22 22 20 22 17 Z M 20 12 H 18 V 16 C 18 18 20 19 22 19 M 32 12 H 34 V 16 C 34 18 32 19 30 19 M 25 22 V 26 M 22 26 H 30" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <text x="145" y="23" fill="#fde68a" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">TOP 50 FINALIST / 500+ TEAMS</text>
  </g>
</svg>
