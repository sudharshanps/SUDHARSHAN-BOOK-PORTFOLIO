<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="50%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="auditCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgCs)"/>

  <!-- Scanning hexagon grid -->
  <g stroke="rgba(0, 242, 254, 0.12)" stroke-width="1" fill="none">
    <polygon points="100,50 140,50 160,85 140,120 100,120 80,85"/>
    <polygon points="200,50 240,50 260,85 240,120 200,120 180,85"/>
    <polygon points="300,50 340,50 360,85 340,120 300,120 280,85"/>
    <polygon points="400,50 440,50 460,85 440,120 400,120 380,85"/>
    <polygon points="500,50 540,50 560,85 540,120 500,120 480,85"/>
  </g>

  <!-- Left: Security Audit Architecture Pipeline -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="220" height="195" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#eef6ff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">CAMPUSSHIELD AUDIT PIPELINE</text>

    <!-- Node 1: Nmap Scanner -->
    <rect x="15" y="40" width="190" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="58" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">Nmap:</text>
    <text x="75" y="58" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">Port Recon &amp; Services</text>

    <!-- Node 2: Burp Suite Proxy -->
    <rect x="15" y="78" width="190" height="30" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
    <text x="25" y="96" fill="#fb923c" font-family="'Fira Code', monospace" font-size="10">Burp:</text>
    <text x="75" y="96" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">HTTP/API Interception</text>

    <!-- Node 3: OWASP ZAP -->
    <rect x="15" y="116" width="190" height="30" rx="5" fill="#1e293b" stroke="#eef6ff" stroke-width="1"/>
    <text x="25" y="134" fill="#67e8f9" font-family="'Fira Code', monospace" font-size="10">ZAP:</text>
    <text x="75" y="134" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">Automated DAST Scan</text>

    <!-- Node 4: AI Assistant Security -->
    <rect x="15" y="154" width="190" height="30" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="25" y="172" fill="#c084fc" font-family="'Fira Code', monospace" font-size="10">AI Test:</text>
    <text x="75" y="172" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">Prompt Injection Defense</text>
  </g>

  <!-- Right: OWASP Vulnerability Matrix & Shield -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="230" height="195" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1.5"/>
    <text x="115" y="24" fill="#f87171" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">OWASP TOP 10 AUDIT MATRIX</text>

    <!-- Finding 1 -->
    <rect x="15" y="40" width="200" height="26" rx="4" fill="#eef6ff" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
    <circle cx="28" cy="53" r="4" fill="#ef4444"/>
    <text x="40" y="57" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9">WS-001: Broken Access (IDOR)</text>

    <!-- Finding 2 -->
    <rect x="15" y="72" width="200" height="26" rx="4" fill="#eef6ff" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
    <circle cx="28" cy="85" r="4" fill="#ef4444"/>
    <text x="40" y="89" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9">WS-004: Cross-Site Scripting</text>

    <!-- Finding 3 -->
    <rect x="15" y="104" width="200" height="26" rx="4" fill="#eef6ff" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <circle cx="28" cy="117" r="4" fill="#f59e0b"/>
    <text x="40" y="121" fill="#fde68a" font-family="'Fira Code', monospace" font-size="9">WS-007: Missing Sec Headers</text>

    <!-- Finding 4 -->
    <rect x="15" y="136" width="200" height="26" rx="4" fill="#eef6ff" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
    <circle cx="28" cy="149" r="4" fill="#a855f7"/>
    <text x="40" y="153" fill="#e9d5ff" font-family="'Fira Code', monospace" font-size="9">WS-010: AI Prompt Injection</text>

    <!-- Status summary -->
    <text x="115" y="180" fill="#34d399" font-family="'Fira Code', monospace" font-size="10" font-weight="600" text-anchor="middle">11 VULN VECTORS AUDITED</text>
  </g>

  <!-- Bottom Badge -->
  <rect x="150" y="280" width="300" height="34" rx="17" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="302" fill="#f87171" font-family="'Inter', sans-serif" font-weight="700" font-size="12" text-anchor="middle">CAMPUSSHIELD • WEB &amp; AI SECURITY AUDIT</text>
</svg>
